services:
  - type: web
    name: antarctic-navigation-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: antarctic-navigation-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CDS_API_URL
        sync: false
      - key: CDS_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
    healthCheckPath: /